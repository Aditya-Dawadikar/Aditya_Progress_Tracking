{% extends "tracker/base.html" %}
{% block title %}{% if is_new %}New event{% else %}Edit event{% endif %} · Goalpost{% endblock %}
{% block content %}
<h1>{% if is_new %}New event{% else %}Edit “{{ event.title }}”{% endif %}</h1>
<form method="post" class="panel">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary">{% if is_new %}Create event{% else %}Save changes{% endif %}</button><a href="{% if event %}{{ event.get_absolute_url }}{% else %}{% url 'tracker:events_list' %}{% endif %}" class="btn">Cancel</a></form>
{% endblock %}
