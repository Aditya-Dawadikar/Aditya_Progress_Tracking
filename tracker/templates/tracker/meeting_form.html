{% extends "tracker/base.html" %}
{% block title %}{% if is_new %}New meeting{% else %}Edit meeting{% endif %} · Goalpost{% endblock %}
{% block content %}
<h1>{% if is_new %}New meeting{% else %}Edit “{{ meeting.title }}”{% endif %}</h1>
<form method="post" class="panel">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary">{% if is_new %}Schedule meeting{% else %}Save changes{% endif %}</button><a href="{% if meeting %}{{ meeting.get_absolute_url }}{% else %}{% url 'tracker:meetings_list' %}{% endif %}" class="btn">Cancel</a></form>
{% endblock %}
