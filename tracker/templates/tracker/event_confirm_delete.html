{% extends "tracker/base.html" %}
{% block title %}Delete event · Goalpost{% endblock %}
{% block content %}<p class="breadcrumb"><a href="{{ event.get_absolute_url }}">{{ event.title }}</a></p><h1>Delete “{{ event.title }}”?</h1><form method="post" class="panel">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-danger">Delete event</button><a href="{{ event.get_absolute_url }}" class="btn">Cancel</a></form>{% endblock %}
