{% extends "tracker/base.html" %}
{% block title %}Delete goal · Goalpost{% endblock %}
{% block content %}
<h1>Delete “{{ goal.title }}”?</h1>
{% if goal.has_tasks %}
  <p class="hint">This deletes all of its tasks too. This can't be undone.</p>
{% endif %}
<form method="post" class="panel">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-danger">Delete goal</button>
  <a href="{{ goal.get_absolute_url }}" class="btn">Cancel</a>
</form>
{% endblock %}
