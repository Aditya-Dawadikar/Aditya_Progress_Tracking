{% extends "tracker/base.html" %}
{% block title %}Board settings · Goalpost{% endblock %}
{% block content %}
<p class="breadcrumb"><a href="{{ board.get_absolute_url }}">{{ board.name }}</a></p>
<h1>Board settings</h1>
<section class="settings-actions">
  <a href="{% url 'tracker:board_edit' board.pk %}" class="btn">Edit board</a>
  <a href="{% url 'tracker:category_list' board.pk %}" class="btn">Categories</a>
  <a href="{% url 'tracker:board_export_json' board.pk %}" class="btn">Export JSON</a>
  <a href="{% url 'tracker:board_import_json' board.pk %}" class="btn">Import JSON</a>
  <a href="{% url 'tracker:board_delete' board.pk %}" class="btn btn-danger">Delete board</a>
</section>
{% endblock %}
