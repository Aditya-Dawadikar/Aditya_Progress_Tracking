{% extends "tracker/base.html" %}
{% block title %}New Test{% endblock %}
{% block content %}
<h1>New Test</h1>

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <div class="field-row">
      <div class="field" style="flex: 1;">
        <label for="{{ form.name.id_for_label }}">Name</label>
        {{ form.name }}
        {{ form.name.errors }}
      </div>
      <div class="field">
        <label for="{{ form.date.id_for_label }}">Date</label>
        {{ form.date }}
        {{ form.date.errors }}
      </div>
    </div>
    <div class="field-row">
      <div class="field" style="flex: 1;">
        <label for="{{ form.notes.id_for_label }}">Notes</label>
        {{ form.notes }}
        {{ form.notes.errors }}
      </div>
    </div>
    <button type="submit">Create &amp; Choose Problems</button>
  </form>
</div>
{% endblock %}
